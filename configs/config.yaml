model:
  in_channels: 1
  out_channels: 4
  base_channels: 64
  depth: 4

dataset:
  csv: "../data/brisc2025/metadata.csv"
  images_root: "../data/brisc2025/"
  size: 572
  mean: 0.195
  std: 0.168

training:
  device: "cuda:0"                              # "cuda:{i}" or "cpu"
  epochs: 200
  lr: 1e-5
  batch_size: 2
  output_dir: "./outputs/first"